<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" type="image/png">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }

        /* Kontainer tampilan error 404 */
        #error-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            text-align: center;
            z-index: 10; 
        }

        .error-code {
            font-size: 7rem;
            font-weight: 700;
            color: #1e3a8a;
            line-height: 1;
            margin: 0 0 12px 0;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #334155;
            margin: 0 0 10px 0;
        }

        .error-desc {
            font-size: 1rem;
            color: #64748b;
            margin: 0;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Halaman Tidak Ditemukan</h2>
        <p class="error-desc">URL yang Anda minta tidak ditemukan di server ini.</p>
    </div>

</body>
</html>
